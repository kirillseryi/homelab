services:
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID
      - PGID
      - TZ
      - UMASK=022
    volumes:
      - /volume2/docker/sonarr:/config
      - /volume1/data/media/shows:/shows
      - /volume1/data/torrents:/torrents
      - /volume1/data/usenet:/usenet
    ports:
      - 8989:8989/tcp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    network_mode: synobridge
  
  lidarr:
    image: linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID
      - PGID
      - TZ
      - UMASK=022
    volumes:
      - /volume2/docker/lidarr:/config
      - /volume1/data/media/music:/music
      - /volume1/data/torrents:/torrents
      - /volume1/data/usenet:/usenet
    ports:
      - 8686:8686/tcp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    network_mode: synobridge
    
  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID
      - PGID
      - TZ
      - UMASK=022
    volumes:
      - /volume2/docker/radarr:/config
      - /volume1/data/media/movies:/movies
      - /volume1/data/torrents:/torrents
      - /volume1/data/usenet:/usenet
    ports:
      - 7878:7878/tcp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    network_mode: synobridge

  readarr:
    image: linuxserver/readarr:develop
    container_name: readarr
    environment:
      - PUID
      - PGID
      - TZ
      - UMASK=022
    volumes:
      - /volume2/docker/readarr:/config
      - /volume1/data/media/books:/books
      - /volume1/data/torrents:/torrents
      - /volume1/data/usenet:/usenet
    ports:
      - 8787:8787/tcp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    network_mode: synobridge

  bazarr:
    image: linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID
      - PGID
      - TZ
      - UMASK=022
    volumes:
      - /volume2/docker/bazarr:/config
      - /volume1/data/media/movies:/movies
      - /volume1/data/media/shows:/shows
      - /volume1/data/torrents:/torrents
      - /volume1/data/usenet:/usenet
    ports:
      - 6767:6767/tcp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    network_mode: synobridge
    
  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID
      - PGID
      - TZ
      - UMASK=022
    volumes:
      - /volume2/docker/prowlarr:/config
    ports:
      - 9696:9696/tcp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    network_mode: synobridge